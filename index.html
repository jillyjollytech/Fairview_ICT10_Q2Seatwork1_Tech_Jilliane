<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Seatwork 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    
    <style>
        body {
            background-image: url('https://i.pinimg.com/736x/72/bd/0e/72bd0eae3e6fbb0bd887c998d549f6c5.jpg');
            background-size: cover;    
            
        }

        .main-container {
            max-width: 900px;
            margin: auto;
            margin-right: auto;
        }

        .header {
            background: linear-gradient(#78866b, #8f9779);
            color: white;
            border-radius: 20px;
            padding: 35px;
        }

        .section-card {
            border: none;
            border-radius: 20px;
            transition: transform 0.2s ease;
        }

        .section-card:hover {
            transform: translateY(-3px);
        }

        .section-title {
            color: #78866b;
            font-weight: bold;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #8f9779;
        }

        .form-control:focus {
            border-color: #78866b;
        }

        .solve-btn {
            background-color: #78866b;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: bold;
            color: white;
        }

        .solve-btn:hover {
            background-color: #fff8de;
        }

        .footer {
            color: white
        }

        #div2 {
            background-color: #dbead2;
            border: 2px solid #8f9779;
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            font-size: 1.3rem;
            font-weight: bold;
            color: #99a98f;
        }
    </style>
</head>
<body>

    <div class="container py-5 main-container">

        <div class="header text-start mb-4">
          <h1 class="display-5 fw-bold"> CAC Club Checker</h1>
          <p class="lead mb-0">Candidate Verifier System</p>
          </div>

        <div class="card section-card">
            <div class="card-body p-4">

                <h2 class="section-title">
                    Input Name:
                </h2>

                <form>

                    <div class="mb-3">
                        <label for="fname" class="form-label fw-bold">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="fname"
                            class="form-control"
                            placeholder="..."
                        >
                    </div>

                    <div class="mb-3">
                        <label for="lname" class="form-label fw-bold">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lname"
                            class="form-control"
                            placeholder="..."
                        >
                    </div>

                    <div class="text-start">
                        <button
                            type="button"
                            py-click="check_candidate_status"
                            class="btn solve-btn"
                        >
                            Enter
                        </button>
                    </div>
                    <br>

                </form>

                <div class="mt-4">
                    <div id="div2">
                        Results will appear here...
                    </div>
                </div>

            </div>
        </div>
    
        
        <div class="text-center mt-4 text-muted">
            <small>Q2 Seatwork 1 • Made with HTML, Bootstrap & PyScript • Jilliane Tech </small>
        </div>

    </div>


    <script type="py" src="main.py"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>


</html>
